<template>
  <c-dashboard-card title="Pricing Discipline" subtitle="Discount overages and pricing rule failures">
    <template if:true={isLoading}>
      <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
    </template>

    <template if:true={hasError}>
      <p class="op-pd__error">{error}</p>
    </template>

    <template if:true={isEmpty}>
      <p class="op-pd__empty">No pricing-discipline findings in this scan. Pricing detectors flag expired promos, stacked discounts, and below-list renewals.</p>
    </template>

    <template if:true={hasData}>
      <div class="op-pd__kpis">
        <div class="op-pd__kpi">
          <p class="op-pd__kpi-label">Total leakage</p>
          <p class="op-pd__kpi-value">{totalFmt}</p>
        </div>
        <div class="op-pd__kpi">
          <p class="op-pd__kpi-label">Findings</p>
          <p class="op-pd__kpi-value">{findingCount}</p>
        </div>
        <div class="op-pd__kpi">
          <p class="op-pd__kpi-label">Avg per finding</p>
          <p class="op-pd__kpi-value">{averageFmt}</p>
        </div>
      </div>

      <ul class="op-pd__list">
        <template for:each={detectorRows} for:item="r">
          <li key={r.detectorId} class="op-pd__row">
            <span class="op-pd__row-label">{r.label}</span>
            <span class="op-pd__row-meta">{r.count} · {r.totalFmt}</span>
          </li>
        </template>
      </ul>

      <button class="op-pd__link" onclick={handleViewAll}>
        View all findings →
      </button>
    </template>
  </c-dashboard-card>
</template>
