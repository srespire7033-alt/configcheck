<template>
  <c-dashboard-card title="Recovery Queue" subtitle="Recovery actions grouped by approval status">
    <template if:true={isLoading}>
      <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
    </template>

    <template if:true={hasError}>
      <p class="op-rq__error">{error}</p>
    </template>

    <template if:true={isEmpty}>
      <p class="op-rq__empty">
        No recovery actions yet. Stage a finding from the All Findings panel above to add it to this queue.
      </p>
    </template>

    <template if:true={hasData}>
      <div class="op-rq__summary">
        <div class="op-rq__summary-block">
          <p class="op-rq__summary-label">In flight</p>
          <p class="op-rq__summary-value">{totalCount}</p>
        </div>
        <div class="op-rq__summary-block">
          <p class="op-rq__summary-label">Projected reclaim</p>
          <p class="op-rq__summary-value op-rq__summary-value--money">{totalProjectedFmt}</p>
        </div>
      </div>

      <!-- Bulk action toolbar — only renders when at least one selection
           or a Committed group exists that can be re-verified en masse. -->
      <div class="op-rq__toolbar">
        <template if:true={hasPendingSelection}>
          <button
            type="button"
            class="op-rq__bulk-btn op-rq__bulk-btn--approve"
            onclick={handleApproveSelected}
            disabled={approving}
          >{approveButtonLabel}</button>
        </template>
        <template if:true={hasApprovedSelection}>
          <button
            type="button"
            class="op-rq__bulk-btn op-rq__bulk-btn--commit"
            onclick={handleCommitSelected}
            disabled={committing}
          >{commitButtonLabel}</button>
        </template>
        <template if:true={hasCommittedActions}>
          <button
            type="button"
            class="op-rq__bulk-btn op-rq__reverify-btn"
            onclick={handleReverifyAll}
            disabled={reverifying}
          >{reverifyButtonLabel}</button>
        </template>
      </div>

      <div class="op-rq__groups">
        <template for:each={groups} for:item="g">
          <div key={g.status} class={g.groupClass}>
            <div class="op-rq__group-header">
              <template if:true={g.selectable}>
                <input
                  type="checkbox"
                  class="op-rq__group-check"
                  data-status={g.status}
                  onchange={handleSelectGroup}
                  title="Select all in this group"
                />
              </template>
              <span class="op-rq__group-status">{g.status}</span>
              <span class="op-rq__group-count">{g.countLabel}</span>
              <span class="op-rq__group-total">{g.projectedFmt}</span>
            </div>
            <ul class="op-rq__actions">
              <template for:each={g.actions} for:item="a">
                <li
                  key={a.id}
                  data-id={a.findingId}
                  class="op-rq__action-row"
                >
                  <div class="op-rq__action" onclick={handleActionClick} onkeydown={handleActionClickKey} role="button" tabindex="0" data-id={a.findingId}>
                    <template if:true={g.selectable}>
                      <input
                        type="checkbox"
                        class="op-rq__action-check"
                        data-id={a.id}
                        checked={a.selected}
                        onchange={handleSelectAction}
                        onclick={handleActionClick}
                      />
                    </template>
                    <span class="op-rq__action-title">{a.findingTitle}</span>
                    <template if:true={a.verifiedBadge}>
                      <span class="op-rq__action-badge">{a.verifiedBadge}</span>
                    </template>
                    <span class="op-rq__action-gap">{a.projectedFmt}</span>
                  </div>
                  <!-- Phase 15a — inline expand for failed-verify rows -->
                  <template if:true={a.showVerifyDetail}>
                    <div class="op-rq__verify-detail">
                      <div class="op-rq__verify-msg">{a.verificationMessage}</div>
                      <template if:true={a.verifyExpectedLine}>
                        <div class="op-rq__verify-vs">{a.verifyExpectedLine}</div>
                      </template>
                    </div>
                  </template>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>
    </template>
  </c-dashboard-card>
</template>
