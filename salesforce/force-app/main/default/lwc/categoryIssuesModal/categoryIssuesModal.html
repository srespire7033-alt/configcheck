<template>
  <section
    class="op-cim__backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="op-cim-title"
    onclick={handleBackdrop}
  >
    <div class="op-cim__modal">
      <header class="op-cim__header">
        <h2 id="op-cim-title" class="op-cim__title">{title}</h2>
        <span class="op-cim__total">{totalCountLabel}</span>
        <button type="button" class="op-cim__close" onclick={handleClose} title="Close (Esc)">
          <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
        </button>
      </header>

      <template if:true={isLoading}>
        <div class="op-cim__loading">
          <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </div>
      </template>

      <template if:true={error}>
        <p class="op-cim__error">{error}</p>
      </template>

      <template if:true={hasData}>
        <div class="op-cim__body">
          <!-- Critical -->
          <template if:true={hasCritical}>
            <div class="op-cim__sec op-cim__sec--critical">
              <div class="op-cim__sec-header">
                <lightning-icon icon-name="utility:error" size="x-small" class="op-cim__sec-icon op-cim__sec-icon--critical"></lightning-icon>
                <span class="op-cim__sec-title op-cim__sec-title--critical">Critical ({criticalCount})</span>
              </div>
            </div>
            <template for:each={criticalGroups} for:item="g">
              <div key={g.detectorId} class="op-cim__group">
                <button
                  type="button"
                  class="op-cim__group-head"
                  data-detector-id={g.detectorId}
                  onclick={handleToggleGroup}
                  aria-expanded={g.isExpanded}
                >
                  <lightning-icon icon-name={g.chevronIcon} size="x-small" class="op-cim__group-chevron"></lightning-icon>
                  <div class={g.iconWrapClass}>
                    <lightning-icon icon-name={g.iconName} size="small" class={g.iconClass}></lightning-icon>
                  </div>
                  <div class="op-cim__group-body">
                    <div class="op-cim__group-title-line">
                      <h3 class="op-cim__group-title">{g.displayTitle}</h3>
                      <span class="op-cim__row-chip">{g.detectorId}</span>
                      <span class="op-cim__group-count">{g.count}</span>
                    </div>
                    <p class="op-cim__row-desc">{g.description}</p>
                    <p class="op-cim__row-impact"><strong>Impact:</strong> {g.impactLabel}</p>
                  </div>
                </button>
                <template lwc:if={g.isExpanded}>
                  <template for:each={g.decoratedRows} for:item="r">
                    <article key={r.id} class="op-cim__row op-cim__row--child">
                      <div class="op-cim__row-body">
                        <h4 class="op-cim__child-title">{r.title}</h4>
                      </div>
                      <div class="op-cim__row-actions">
                        <button type="button" data-id={r.id} class="op-cim__btn op-cim__btn--fix" onclick={handleMarkFixed} disabled={r.markBtnDisabled}>{r.markBtnLabel}</button>
                        <button type="button" data-id={r.id} class="op-cim__btn op-cim__btn--details" onclick={handleDetails}>Details</button>
                      </div>
                    </article>
                  </template>
                </template>
              </div>
            </template>
          </template>

          <!-- Warning -->
          <template if:true={hasWarning}>
            <div class="op-cim__sec op-cim__sec--warning">
              <div class="op-cim__sec-header">
                <lightning-icon icon-name="utility:warning" size="x-small" class="op-cim__sec-icon op-cim__sec-icon--warning"></lightning-icon>
                <span class="op-cim__sec-title op-cim__sec-title--warning">Warnings ({warningCount})</span>
              </div>
            </div>
            <template for:each={warningGroups} for:item="g">
              <div key={g.detectorId} class="op-cim__group">
                <button
                  type="button"
                  class="op-cim__group-head"
                  data-detector-id={g.detectorId}
                  onclick={handleToggleGroup}
                  aria-expanded={g.isExpanded}
                >
                  <lightning-icon icon-name={g.chevronIcon} size="x-small" class="op-cim__group-chevron"></lightning-icon>
                  <div class={g.iconWrapClass}>
                    <lightning-icon icon-name={g.iconName} size="small" class={g.iconClass}></lightning-icon>
                  </div>
                  <div class="op-cim__group-body">
                    <div class="op-cim__group-title-line">
                      <h3 class="op-cim__group-title">{g.displayTitle}</h3>
                      <span class="op-cim__row-chip">{g.detectorId}</span>
                      <span class="op-cim__group-count">{g.count}</span>
                    </div>
                    <p class="op-cim__row-desc">{g.description}</p>
                    <p class="op-cim__row-impact"><strong>Impact:</strong> {g.impactLabel}</p>
                  </div>
                </button>
                <template lwc:if={g.isExpanded}>
                  <template for:each={g.decoratedRows} for:item="r">
                    <article key={r.id} class="op-cim__row op-cim__row--child">
                      <div class="op-cim__row-body">
                        <h4 class="op-cim__child-title">{r.title}</h4>
                      </div>
                      <div class="op-cim__row-actions">
                        <button type="button" data-id={r.id} class="op-cim__btn op-cim__btn--fix" onclick={handleMarkFixed} disabled={r.markBtnDisabled}>{r.markBtnLabel}</button>
                        <button type="button" data-id={r.id} class="op-cim__btn op-cim__btn--details" onclick={handleDetails}>Details</button>
                      </div>
                    </article>
                  </template>
                </template>
              </div>
            </template>
          </template>

          <!-- Info -->
          <template if:true={hasInfo}>
            <div class="op-cim__sec op-cim__sec--info">
              <div class="op-cim__sec-header">
                <lightning-icon icon-name="utility:info" size="x-small" class="op-cim__sec-icon op-cim__sec-icon--info"></lightning-icon>
                <span class="op-cim__sec-title op-cim__sec-title--info">Best Practices ({infoCount})</span>
              </div>
            </div>
            <template for:each={infoGroups} for:item="g">
              <div key={g.detectorId} class="op-cim__group">
                <button
                  type="button"
                  class="op-cim__group-head"
                  data-detector-id={g.detectorId}
                  onclick={handleToggleGroup}
                  aria-expanded={g.isExpanded}
                >
                  <lightning-icon icon-name={g.chevronIcon} size="x-small" class="op-cim__group-chevron"></lightning-icon>
                  <div class={g.iconWrapClass}>
                    <lightning-icon icon-name={g.iconName} size="small" class={g.iconClass}></lightning-icon>
                  </div>
                  <div class="op-cim__group-body">
                    <div class="op-cim__group-title-line">
                      <h3 class="op-cim__group-title">{g.displayTitle}</h3>
                      <span class="op-cim__row-chip">{g.detectorId}</span>
                      <span class="op-cim__group-count">{g.count}</span>
                    </div>
                    <p class="op-cim__row-desc">{g.description}</p>
                    <p class="op-cim__row-impact"><strong>Impact:</strong> {g.impactLabel}</p>
                  </div>
                </button>
                <template lwc:if={g.isExpanded}>
                  <template for:each={g.decoratedRows} for:item="r">
                    <article key={r.id} class="op-cim__row op-cim__row--child">
                      <div class="op-cim__row-body">
                        <h4 class="op-cim__child-title">{r.title}</h4>
                      </div>
                      <div class="op-cim__row-actions">
                        <button type="button" data-id={r.id} class="op-cim__btn op-cim__btn--fix" onclick={handleMarkFixed} disabled={r.markBtnDisabled}>{r.markBtnLabel}</button>
                        <button type="button" data-id={r.id} class="op-cim__btn op-cim__btn--details" onclick={handleDetails}>Details</button>
                      </div>
                    </article>
                  </template>
                </template>
              </div>
            </template>
          </template>

          <template if:false={hasAnyIssues}>
            <p class="op-cim__empty">No issues in this category. 🎉</p>
          </template>
        </div>
      </template>
    </div>
  </section>
</template>
