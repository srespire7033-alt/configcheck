<template>
  <article class="op-cx">
    <header class="op-cx__header">
      <div class="op-cx__title-block">
        <div class="op-cx__icon-wrap">
          <lightning-icon icon-name="utility:layers" size="small" class="op-cx__icon"></lightning-icon>
        </div>
        <div>
          <h2 class="op-cx__title">Org Complexity Score</h2>
          <p class="op-cx__subtitle">Compared to healthy Salesforce orgs of similar size</p>
        </div>
      </div>
      <template if:true={hasData}>
        <span class={chipClass}>{rating}</span>
      </template>
    </header>

    <template if:true={isLoading}>
      <div class="op-cx__loading">
        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <p class="op-cx__error">{error}</p>
    </template>

    <template if:true={hasData}>
      <!-- Score + gauge -->
      <div class="op-cx__score-block">
        <p class={scoreClass}>
          <span class="op-cx__score-num">{totalScore}</span>
          <span class="op-cx__score-unit">points</span>
        </p>
        <div class="op-cx__gauge">
          <div class="op-cx__gauge-fill" style={gaugeWidth}></div>
        </div>
        <div class="op-cx__gauge-labels">
          <span>0 (Simple)</span>
          <span>150+ (Very Complex)</span>
        </div>
      </div>

      <p class="op-cx__description">{description}</p>

      <!-- Toggle breakdown -->
      <button type="button" class="op-cx__toggle" onclick={toggleBreakdown}>
        <lightning-icon icon-name={toggleIconName} size="xx-small" class="op-cx__toggle-icon"></lightning-icon>
        {toggleLabel}
      </button>

      <template if:true={isExpanded}>
        <template if:true={hasFactors}>
          <div class="op-cx__factors">
            <template for:each={visibleFactors} for:item="f">
              <div key={f.label} class="op-cx__factor">
                <span class="op-cx__factor-label" title={f.label}>{f.label}</span>
                <span class="op-cx__factor-count">{f.count}</span>
                <div class="op-cx__factor-bar">
                  <div class="op-cx__factor-bar-fill" style={f.userBarStyle}></div>
                  <template if:true={f.hasBenchmark}>
                    <div class="op-cx__factor-bench" style={f.benchmarkStyle}></div>
                  </template>
                </div>
                <span class={f.contributionClass}>{f.contributionLabel}</span>
              </div>
            </template>

            <!-- Legend -->
            <div class="op-cx__legend">
              <div class="op-cx__legend-item">
                <span class="op-cx__legend-bar"></span>
                <span>Your count</span>
              </div>
              <div class="op-cx__legend-item">
                <span class="op-cx__legend-tick"></span>
                <span>Industry benchmark</span>
              </div>
            </div>
          </div>
        </template>
      </template>
    </template>
  </article>
</template>
