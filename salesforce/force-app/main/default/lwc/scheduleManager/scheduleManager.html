<template>
  <c-dashboard-card title="Scheduled scans" subtitle="Set up recurring forensic scans">
    <lightning-button
      slot="actions"
      variant="brand"
      label="New schedule"
      icon-name="utility:add"
      onclick={handleOpen}
    ></lightning-button>

    <template if:true={loading}>
      <div class="op-sm__loading">
        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
      </div>
    </template>

    <template if:true={error}>
      <p class="op-sm__error">{error}</p>
    </template>

    <template if:true={isEmpty}>
      <p class="op-sm__empty">
        No scheduled scans yet. Click <strong>New schedule</strong> to set up a recurring forensic scan.
      </p>
    </template>

    <template if:true={hasSchedules}>
      <table class="op-sm__table">
        <thead>
          <tr>
            <th>Schedule</th>
            <th>Type</th>
            <th>Status</th>
            <th>Last run</th>
            <th>Next run</th>
            <th class="op-sm__th-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <template for:each={rows} for:item="r">
            <tr key={r.id}>
              <td>
                <div class="op-sm__name">{r.label}</div>
                <div class="op-sm__cron">{r.cronExpression}</div>
              </td>
              <td>{r.productType}</td>
              <td>
                <span class={r.statusBadge.cls}>{r.statusBadge.label}</span>
              </td>
              <td>{r.lastRunFmt}</td>
              <td>{r.nextRunFmt}</td>
              <td class="op-sm__td-actions">
                <lightning-button
                  variant="base"
                  label="Run now"
                  data-id={r.id}
                  onclick={handleRunNow}
                  disabled={busy}
                ></lightning-button>
                <lightning-button
                  variant="base"
                  label={r.toggleLabel}
                  data-id={r.id}
                  onclick={handleToggle}
                  disabled={busy}
                ></lightning-button>
                <lightning-button
                  variant="base"
                  label="Delete"
                  data-id={r.id}
                  onclick={handleDelete}
                  disabled={busy}
                ></lightning-button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>

    <!-- Modal -->
    <template if:true={showModal}>
      <div class="op-sm__overlay" onclick={handleClose}></div>
      <section class="op-sm__modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading" tabindex="-1" onkeydown={handleModalKeydown}>
        <header class="op-sm__modal-header">
          <h2 id="modal-heading">Schedule a Scan</h2>
          <lightning-button-icon
            icon-name="utility:close"
            variant="bare"
            alternative-text="Close"
            onclick={handleClose}
            disabled={busy}
          ></lightning-button-icon>
        </header>

        <div class="op-sm__modal-body">
          <!-- Frequency -->
          <div class="op-sm__field">
            <label class="op-sm__field-label">Frequency</label>
            <div class="op-sm__freq-row" role="group" aria-label="Frequency">
              <template for:each={frequencyOptions} for:item="o">
                <button
                  key={o.id}
                  type="button"
                  class={o.cls}
                  data-id={o.id}
                  onclick={handleFrequencyPick}
                  disabled={busy}
                >
                  <lightning-icon icon-name={o.icon} size="x-small" class="op-sm__freq-icon"></lightning-icon>
                  <span class="op-sm__freq-label">{o.label}</span>
                </button>
              </template>
            </div>
          </div>

          <!-- Time (always shown) -->
          <div class="op-sm__field">
            <label class="op-sm__field-label">Time</label>
            <input
              type="time"
              class="op-sm__time-input"
              aria-label="Scan time"
              value={newTime}
              onchange={handleTimeChange}
              disabled={busy}
            />
          </div>

          <!-- One-time: Date picker -->
          <template if:true={isOneTime}>
            <div class="op-sm__field">
              <label class="op-sm__field-label">Date</label>
              <lightning-input
                type="date"
                variant="label-hidden"
                value={defaultOneTimeDate}
                onchange={handleDateChange}
                disabled={busy}
              ></lightning-input>
            </div>
          </template>

          <!-- Weekly: Day-of-week picker -->
          <template if:true={isWeekly}>
            <div class="op-sm__field">
              <label class="op-sm__field-label">Day of week</label>
              <div class="op-sm__dow-row">
                <template for:each={dayOfWeekOptions} for:item="d">
                  <button
                    key={d.id}
                    type="button"
                    class={d.cls}
                    data-id={d.id}
                    onclick={handleDayOfWeekPick}
                    disabled={busy}
                  >{d.label}</button>
                </template>
              </div>
            </div>
          </template>

          <!-- Monthly: Day-of-month dropdown -->
          <template if:true={isMonthly}>
            <div class="op-sm__field">
              <label class="op-sm__field-label">Day of month</label>
              <lightning-combobox
                variant="label-hidden"
                value={newDayOfMonth}
                options={dayOfMonthOptions}
                onchange={handleDayOfMonthChange}
                disabled={busy}
              ></lightning-combobox>
            </div>
          </template>

          <!-- Timezone (read-only display) -->
          <div class="op-sm__field">
            <label class="op-sm__field-label">Timezone</label>
            <div class="op-sm__tz-display">
              <lightning-icon icon-name="utility:world" size="x-small" class="op-sm__tz-icon"></lightning-icon>
              {timezoneDisplay}
            </div>
          </div>

          <p class="op-sm__detected">
            <lightning-icon icon-name="utility:info_alt" size="xx-small" class="op-sm__detected-icon"></lightning-icon>
            {productDetectedLabel}
          </p>
        </div>

        <footer class="op-sm__modal-footer">
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleClose}
            disabled={busy}
          ></lightning-button>
          <lightning-button
            variant="brand"
            label={saveButtonLabel}
            onclick={handleSave}
            disabled={busy}
          ></lightning-button>
        </footer>
      </section>
    </template>
  </c-dashboard-card>
</template>
