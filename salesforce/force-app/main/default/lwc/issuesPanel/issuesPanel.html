<template>
  <article class="op-tip">
    <header class="op-tip__header">
      <div class="op-tip__head-left">
        <div class="op-tip__head-icon-wrap">
          <lightning-icon icon-name="utility:error" size="small" class="op-tip__head-icon"></lightning-icon>
        </div>
        <div>
          <h2 class="op-tip__title">Top Issues to Address</h2>
          <p class="op-tip__subtitle">Highest priority issues affecting your configuration</p>
        </div>
      </div>
    </header>

    <template if:true={isLoading}>
      <div class="op-tip__loading"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
    </template>

    <template if:true={hasError}>
      <p class="op-tip__error">{error}</p>
    </template>

    <template if:true={isEmpty}>
      <p class="op-tip__empty">No issues to display.</p>
    </template>

    <template if:true={hasGroups}>
      <div class="op-tip__list">
        <template for:each={rows} for:item="r">
          <article
            key={r.groupKey}
            data-key={r.groupKey}
            class={r.borderClass}
            onclick={toggleExpand}
          >
            <div class="op-tip__row-num">{r.rowNumber}</div>
            <div class="op-tip__row-body">
              <div class="op-tip__row-chips">
                <span class={r.severityChipClass}>{r.severity}</span>
                <span class="op-tip__row-cat">{r.categoryLabel}</span>
                <template if:true={r.isMulti}>
                  <span class="op-tip__related-chip">{r.relatedLabel}</span>
                </template>
                <template lwc:if={r.hasGap}>
                  <span class="op-tip__gap-chip">{r.gapLabel}</span>
                </template>
                <span class={r.trendClass}>{r.trendLabel}</span>
              </div>
              <h3 class="op-tip__row-title" data-id={r.primaryFindingId} onclick={handleHeadlineClick}>
                {r.headlineWithCount}
              </h3>
              <p class="op-tip__row-desc">{r.headlineDescription}</p>

              <template if:true={r.isExpanded}>
                <div class="op-tip__members">
                  <template for:each={r.members} for:item="m">
                    <div key={m.id} class="op-tip__member" data-id={m.id} onclick={handleMemberClick}>
                      <div class="op-tip__member-body">
                        <p class="op-tip__member-title">{m.title}</p>
                        <p class="op-tip__member-desc">{m.description}</p>
                      </div>
                      <span class="op-tip__member-count">{m.affectedCount}</span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
            <div class="op-tip__row-affected">
              <span class="op-tip__row-affected-val">{r.affectedLabel}</span>
              <lightning-icon icon-name={r.chevronIcon} size="x-small" class="op-tip__row-chev"></lightning-icon>
            </div>
          </article>
        </template>
      </div>
    </template>

    <template if:true={isModalOpen}>
      <c-issue-detail-modal
        issue-id={openDetailId}
        oncloseissuemodal={handleCloseModal}
        onstatuschanged={handleStatusChanged}
      ></c-issue-detail-modal>
    </template>
  </article>
</template>
