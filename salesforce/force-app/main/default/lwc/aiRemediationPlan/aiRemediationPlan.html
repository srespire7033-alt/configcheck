<template>
  <article class="op-rp">
    <header class="op-rp__header">
      <div class="op-rp__head-left">
        <div class="op-rp__head-icon-wrap">
          <lightning-icon icon-name="utility:sparkle" size="small" class="op-rp__head-icon"></lightning-icon>
        </div>
        <div>
          <h2 class="op-rp__title">AI Remediation Plan</h2>
          <p class="op-rp__subtitle">Prioritized 3-phase fix plan generated by AI</p>
        </div>
      </div>
      <button class="op-rp__regen" onclick={handleRegenerate} disabled={regenerating}>
        <lightning-icon icon-name="utility:refresh" size="xx-small" class="op-rp__regen-icon"></lightning-icon>
        Regenerate
      </button>
    </header>

    <template if:true={isLoading}>
      <div class="op-rp__loading"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
    </template>

    <template if:true={hasError}>
      <p class="op-rp__error">{error}</p>
    </template>

    <template if:true={isEmpty}>
      <p class="op-rp__empty">No findings to remediate yet. Run a forensic scan to generate a fix plan.</p>
    </template>

    <template if:true={hasContent}>
      <div class="op-rp__body">
        <p class="op-rp__intro">Here is a prioritized remediation plan for your Salesforce Revenue Cloud implementation:</p>
        <p class="op-rp__metric">{scoreLine}</p>
        <p class="op-rp__metric">{totalLeakageLine}</p>

        <template for:each={phaseRows} for:item="p">
          <section key={p.phaseNum} class="op-rp__phase">
            <hr class="op-rp__divider"/>
            <h3 class="op-rp__phase-title">{p.heading}</h3>
            <p class="op-rp__phase-blurb"><em>{p.blurb}</em></p>
            <p class="op-rp__phase-meta"><em>{p.subHeading}</em></p>
            <p class="op-rp__phase-total">{p.totalRecoveredLabel}</p>
            <ol class="op-rp__steps">
              <template for:each={p.stepRows} for:item="s">
                <li key={s.detectorId} class="op-rp__step">
                  <p class="op-rp__step-head">
                    <span class="op-rp__step-code">[{s.detectorId}]</span>: {s.recommendation}
                  </p>
                  <ul class="op-rp__step-meta">
                    <li>Est. Time: <strong>{s.timeLabel}</strong> · {s.findingLabel}</li>
                    <li>$ Recovered: <strong>{s.recoveredLabel}</strong></li>
                  </ul>
                </li>
              </template>
            </ol>
            <!-- Phase 22q — per-phase view-all toggle -->
            <template if:true={p.paginated}>
              <button class="op-rp__toggle" data-phase={p.phaseNum} onclick={toggleShowAll} type="button">
                {p.toggleLabel}
              </button>
            </template>
          </section>
        </template>
      </div>
    </template>
  </article>
</template>
