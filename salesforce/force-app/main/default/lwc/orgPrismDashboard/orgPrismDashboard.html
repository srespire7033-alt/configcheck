<template>
  <template if:true={hasUrl}>
    <iframe
      src={computedSrc}
      style={iframeStyle}
      title="OrgPrism Dashboard"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </template>

  <template if:false={hasUrl}>
    <div class="slds-box slds-theme_warning slds-text-align_center slds-p-around_medium">
      <p class="slds-text-heading_small">OrgPrism Dashboard URL not configured</p>
      <p class="slds-text-body_small slds-m-top_x-small">
        Open this Lightning App Page in the Lightning App Builder and set
        the <strong>Dashboard URL</strong> property on the OrgPrism
        Dashboard component (e.g. <code>https://orgprism.vercel.app</code>).
      </p>
      <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
        Also ensure Setup → Security → Trusted URLs includes the SaaS host
        with <code>frame-src</code> allowed.
      </p>
    </div>
  </template>
</template>
