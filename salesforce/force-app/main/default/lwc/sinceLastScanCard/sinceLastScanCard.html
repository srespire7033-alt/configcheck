<template>
  <template if:true={shouldRender}>
    <article class="op-sls">
      <!-- Header: icon + title + dates + net delta -->
      <header class="op-sls__header">
        <div class="op-sls__title-block">
          <div class={iconWrapClass}>
            <lightning-icon
              icon-name={trendIcon}
              size="small"
              class={iconColorClass}
            ></lightning-icon>
          </div>
          <div>
            <h2 class="op-sls__title">Since your last scan</h2>
            <p class="op-sls__dates">{fromDate} → {toDate}</p>
          </div>
        </div>
        <div class="op-sls__delta-block">
          <p class={netDeltaClass}>{netDeltaLabel}</p>
          <p class="op-sls__delta-sub">{netDeltaSubLabel}</p>
        </div>
      </header>

      <!-- 4 tiles -->
      <div class="op-sls__tiles">
        <div class={newTileClass}>
          <p class="op-sls__tile-label">
            <lightning-icon icon-name="utility:sparkle" size="xx-small" class="op-sls__tile-icon"></lightning-icon>
            NEW
          </p>
          <p class="op-sls__tile-count">{summary.newCount}</p>
          <p class="op-sls__tile-money">{newTotalFmt}</p>
        </div>
        <div class={escalatedTileClass}>
          <p class="op-sls__tile-label">
            <lightning-icon icon-name="utility:trending" size="xx-small" class="op-sls__tile-icon"></lightning-icon>
            ESCALATED
          </p>
          <p class="op-sls__tile-count">{summary.escalatedCount}</p>
          <p class="op-sls__tile-money">{escalatedTotalFmt}</p>
        </div>
        <div class={resolvedTileClass}>
          <p class="op-sls__tile-label">
            <lightning-icon icon-name="utility:check" size="xx-small" class="op-sls__tile-icon"></lightning-icon>
            RESOLVED
          </p>
          <p class="op-sls__tile-count">{summary.resolvedCount}</p>
          <p class="op-sls__tile-money">{resolvedTotalFmt}</p>
        </div>
        <div class={improvedTileClass}>
          <p class="op-sls__tile-label">
            <lightning-icon icon-name="utility:trending" size="xx-small" class="op-sls__tile-icon op-sls__tile-icon--down"></lightning-icon>
            IMPROVED
          </p>
          <p class="op-sls__tile-count">{summary.improvedCount}</p>
          <p class="op-sls__tile-money">{improvedTotalFmt}</p>
        </div>
      </div>

      <a href="javascript:void(0)" class="op-sls__see-full" onclick={handleSeeFullDiff}>
        See full diff
        <lightning-icon icon-name="utility:forward" size="xx-small" class="op-sls__arrow"></lightning-icon>
      </a>
    </article>
  </template>
</template>
