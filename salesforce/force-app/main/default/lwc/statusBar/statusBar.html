<template>
  <template if:true={hasItems}>
    <div class="op-sb" role="status" aria-live="polite" aria-atomic="true">
      <template for:each={computedItems} for:item="it">
        <div key={it.id} class={it.rootClass}>
          <lightning-icon icon-name={it.iconName} size="x-small" class="op-sb__icon"></lightning-icon>
          <span class="op-sb__message">{it.message}</span>
          <template if:true={it.dismissible}>
            <button
              type="button"
              class="op-sb__dismiss"
              data-id={it.id}
              onclick={handleDismiss}
              aria-label="Dismiss"
            >×</button>
          </template>
        </div>
      </template>
    </div>
  </template>
</template>
