<template>
  <div class="op-em">
    <lightning-button
      variant="neutral"
      label={triggerLabel}
      icon-name="utility:download"
      icon-position="left"
      onclick={toggleMenu}
      disabled={busy}
    ></lightning-button>

    <template if:true={open}>
      <div class="op-em__menu op-em__menu--open" role="menu">
        <button type="button" role="menuitem" class="op-em__item" onclick={handleFindings}>
          <lightning-icon icon-name="utility:filter" size="x-small" class="op-em__item-icon"></lightning-icon>
          <span class="op-em__item-body">
            <span class="op-em__item-title">All findings (CSV)</span>
            <span class="op-em__item-sub">Latest scan · for Excel or Sheets</span>
          </span>
        </button>
        <button type="button" role="menuitem" class="op-em__item" onclick={handleRecovery}>
          <lightning-icon icon-name="utility:flow" size="x-small" class="op-em__item-icon"></lightning-icon>
          <span class="op-em__item-body">
            <span class="op-em__item-title">Recovery actions (CSV)</span>
            <span class="op-em__item-sub">Pending / Approved / Committed audit trail</span>
          </span>
        </button>
        <div class="op-em__divider"></div>
        <button type="button" role="menuitem" class="op-em__item" onclick={handlePdf}>
          <lightning-icon icon-name="utility:file" size="x-small" class="op-em__item-icon"></lightning-icon>
          <span class="op-em__item-body">
            <span class="op-em__item-title">Executive PDF report</span>
            <span class="op-em__item-sub">Branded client deliverable · opens in new tab</span>
          </span>
        </button>
      </div>
    </template>
  </div>
</template>
